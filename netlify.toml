# Netlify build settings for ResQfood. See docs/deploying-to-netlify.md.
#
# Netlify detects Next.js and applies its own Next.js runtime, so no publish directory and no plugin line
# are needed. Keep NODE_VERSION in step with .nvmrc.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"
