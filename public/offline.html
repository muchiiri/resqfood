<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#1F5C2E" />
    <title>Offline | ResQfood</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #fbf8ee;
        color: #1a2e1f;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 420px; }
      img { width: 96px; height: 96px; border-radius: 20px; }
      h1 { margin: 20px 0 8px; font-size: 1.75rem; line-height: 1.2; }
      p { margin: 0 0 24px; color: #5f6f62; line-height: 1.5; }
      a {
        display: inline-flex;
        align-items: center;
        min-height: 44px;
        padding: 0 24px;
        border-radius: 999px;
        background: #1f5c2e;
        color: #ffffff;
        font-weight: 700;
        text-decoration: none;
      }
      a:focus-visible { outline: 3px solid #7da83a; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-192.png" alt="ResQfood" width="96" height="96" />
      <h1>You are offline</h1>
      <p>Listings, claims and your pantry need an internet connection. Check your connection and try again.</p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
